services:
  - type: web
    name: moki
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Optional. Set this to a PostgreSQL connection string (e.g. a free Neon
      # database) to keep shared quiz codes across restarts and redeploys.
      # Leave it unset and quizzes fall back to on-disk storage, which Render's
      # free tier wipes on every deploy.
      - key: DATABASE_URL
        sync: false
      # Set to 1 to stop the free instance sleeping (see README).
      - key: KEEP_AWAKE
        value: "0"
      # Optional quiet hours in UTC, e.g. 2-18 covers ~07:30-23:30 IST.
      - key: KEEP_AWAKE_HOURS
        sync: false
